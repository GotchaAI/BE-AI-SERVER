name: Deploy

on:
  workflow_dispatch:
  push:
    branches: ["develop"]


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. checkout develop branch
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          ref: develop

      # 2. Docker 로그인
      - name: Login to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # 3. 이미지 build 및 push
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/gotcha-ai:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/gotcha-ai:latest
          

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # 1. checkout branch
      - name: Check PR
        uses: actions/checkout@v3

      # 2. EC2 pull
      - name: EC2 Docker Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            cd ~/ai-server
          
            docker stop ai-server || true
            docker rm ai-server || true
            
            docker system prune -a -f || true
            
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/gotcha-ai:latest
            
            docker run -d \
              --name ai-server \
              --env-file .env \
              -p 8000:8000 \
              ${{ secrets.DOCKER_USERNAME }}/gotcha-ai:latest

  notify:
    needs: deploy
    runs-on: ubuntu-latest



    steps:
      - name: Slack notification on success
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "✅ *배포 성공:* ${{ github.repository }} 저장소의 `${{ github.ref_name }}` 브랜치가 성공적으로 배포되었습니다.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Status:* `${{ job.status }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Slack notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": "❌ *배포 실패:* ${{ github.repository }} 저장소의 `${{ github.ref_name }}` 브랜치 배포가 실패했습니다.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Status:* `${{ job.status }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }